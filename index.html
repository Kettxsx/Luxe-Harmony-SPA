<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Harmony</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }

        .hero {
            background: url('Home.png') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            align-items: flex-end; /* Botão no fundo */
            justify-content: flex-start; /* Botão na esquerda */
            box-sizing: border-box;
            padding: 0 0 80px 60px; /* Ajuste aqui a distância da borda */
        }

        .btn-entrar {
            background-color: #3d3d3d; /* Cinza escuro da sua paleta */
            color: #ffffff;
            padding: 25px 100px;
            text-decoration: none;
            font-family: 'Times New Roman', serif; /* Estilo luxuoso */
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 12px;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 100px 30px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background-color: #000000;
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <section class="hero">
        <a href="cadastro.html" class="btn-entrar">Avançar</a>
    </section>
</body>
</html>
